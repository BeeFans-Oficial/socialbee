# BeeSocial — banco, API e app, em três serviços.
#
#   cp .env.example .env
#   docker compose up
#
# Depois: app em http://localhost:3000, API em http://localhost:3333/v1,
# bucket das imagens em http://localhost:9000/beesocial.
#
# O banco expõe 5433 no host (e não 5432) para não colidir com um Postgres
# instalado na máquina; dentro da rede do compose os serviços falam pela porta
# padrão, pelo nome `db`.

name: beesocial

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beesocial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beesocial}
      POSTGRES_DB: ${POSTGRES_DB:-beesocial}
      # Sem isto o Postgres inicializa com o locale do container e a ordenação
      # de texto muda entre ambientes — o tipo de diferença que só aparece num
      # ORDER BY com acento, meses depois.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Volume nomeado: `docker compose down` NÃO apaga os dados. Para zerar de
      # propósito é `docker compose down -v`.
      - beesocial-db:/var/lib/postgresql/data
    healthcheck:
      # É o que faz a API esperar o banco de verdade. `depends_on` sem
      # healthcheck só garante que o container subiu — e o Postgres aceita
      # conexão vários segundos depois disso, então a API morreria na primeira
      # tentativa de migration.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beesocial} -d ${POSTGRES_DB:-beesocial}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Armazenamento de objetos para as imagens (avatar, capa, página de chegada,
  # miniatura), SÓ PARA DESENVOLVIMENTO E CI. Em produção é o Cloudflare R2
  # (ver docker-compose.prod.yml); aqui um servidor S3 local faz o papel dele.
  #
  # RustFS, e não MinIO: o MinIO de código aberto foi arquivado em 2026 e as
  # imagens saíram dos registros. O RustFS fala a mesma API (porta 9000) e tem
  # imagem pública. Tag fixa: atualizar é decisão, não efeito de um build.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-beesocial}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-beesocial-dev}
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      # Volume nomeado, como o do banco: `down` não apaga as imagens.
      - beesocial-media:/data
    healthcheck:
      # A raiz responde 403 (sem credencial), o que já prova que o processo
      # está atendendo. `-f` falharia; o teste é "respondeu HTTP".
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Roda UMA vez a cada `up`: cria o bucket (se não existe) e aplica a política
  # de LEITURA anônima (deploy/s3/politica-publica.json) — é o que faz a URL da
  # imagem abrir no navegador sem a API no meio. Escrita continua exigindo
  # credencial. Em produção o equivalente é o "domínio público" do bucket no
  # painel do R2.
  s3-init:
    image: amazon/aws-cli:2.33.11
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-beesocial}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-beesocial-dev}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-beesocial}
    volumes:
      - ./deploy/s3/politica-publica.json:/politica-publica.json:ro
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$S3_BUCKET 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $$S3_BUCKET &&
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket $$S3_BUCKET --policy file:///politica-publica.json &&
        echo bucket $$S3_BUCKET pronto
      "

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER:-beesocial}:${POSTGRES_PASSWORD:-beesocial}@db:5432/${POSTGRES_DB:-beesocial}
      DB_SCHEMA: ${DB_SCHEMA:-socialbee}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env da raiz (cp .env.example .env)}
      JWT_TTL: ${JWT_TTL:-7d}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?defina INTERNAL_API_SECRET no .env da raiz (cp .env.example .env)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:${WEB_PORT:-3000}}
      # `NODE_ENV=production` deixaria o cookie exigindo HTTPS, e em
      # `http://localhost` o navegador o descartaria — o login pareceria
      # funcionar e nada ficaria autenticado. Em deploy real, remova esta linha.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Conta de demonstração (bella@beesocial.app / 123456). Desligue em
      # qualquer coisa que não seja sua máquina.
      SEED_DEMO: ${SEED_DEMO:-true}
      # Armazenamento de imagens (ver o serviço `rustfs` acima).
      #
      # S3_ENDPOINT é o endereço DENTRO da rede do compose: é por ele que a API
      # grava. MEDIA_PUBLIC_URL é o endereço que o NAVEGADOR usa para ler, e
      # por isso aponta para a porta publicada no host. Os dois precisam
      # apontar para o mesmo bucket.
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-beesocial}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-beesocial}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-beesocial-dev}
      # O bucket vai no caminho (`/bucket/chave`), não no subdomínio como na
      # Amazon. Sem isto o SDK tenta `beesocial.rustfs` e falha no DNS.
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:${S3_PORT:-9000}/${S3_BUCKET:-beesocial}}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      args:
        # Precisa ser argumento de BUILD, não só variável de ambiente: o Next
        # embute `NEXT_PUBLIC_*` no bundle no momento da compilação. Sem esta
        # linha, mudar o endereço no `.env` não tem efeito nenhum no que o
        # navegador recebe — a imagem sai com o valor default embutido e o botão
        # de copiar entrega um link para uma porta onde não há nada.
        #
        # Por isso o default sai de `WEB_PORT`: as duas coisas TÊM que
        # concordar, e quem muda a porta não deveria precisar lembrar de mudar
        # o endereço também.
        #
        # No Dockerfile ela NÃO tem default, de propósito: sem esta linha o
        # build falha. Aqui o default de `localhost` é legítimo, porque este
        # arquivo É o ambiente de desenvolvimento — em produção quem preenche é
        # docker-compose.prod.yml, com o domínio real.
        #
        # Mudou o endereço? `docker compose up --build`.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:${WEB_PORT:-3000}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Endereço da API DENTRO da rede do compose. O navegador nunca vê esta
      # URL: ele chama `/api/v1/*` na própria origem e o Next reescreve para cá
      # (ver next.config.js). É o que dispensa CORS e faz o cookie de sessão
      # funcionar sem `SameSite=None`.
      API_INTERNAL_URL: http://api:3333
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?defina INTERNAL_API_SECRET no .env da raiz}
      # Em runtime isto serve só ao SERVIDOR do Next (o redirect de "não
      # encontrado" em `/r/<código>`). O lado do cliente já vem embutido do
      # build, pelo argumento acima.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:${WEB_PORT:-3000}}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  beesocial-db:
  beesocial-media:
