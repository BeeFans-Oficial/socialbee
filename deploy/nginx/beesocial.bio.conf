# BeeSocial — borda do FRONT.
#
# Instalar em:
#   /etc/nginx/sites-available/beesocial.bio
#   ln -s ../sites-available/beesocial.bio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Versão SEM TLS, de propósito: o certbot reescreve este bloco ao emitir o
# certificado, acrescentando o `listen 443 ssl` e o redirecionamento da 80.
#
#   certbot --nginx -d beesocial.bio -d www.beesocial.bio
#
# TOPOLOGIA: banco, API e front na MESMA máquina, cada serviço no seu domínio.
#
#   beesocial.bio      -> nginx -> 127.0.0.1:3000  (Next)
#   api.beesocial.bio  -> nginx -> 127.0.0.1:3333  (NestJS)
#
# O navegador só encosta no primeiro — este arquivo é a única borda que o
# produto atravessa. As chamadas do painel vão para `/api/v1/*` na própria
# origem e quem repassa é o Route Handler do Next, que alcança a API pela REDE
# INTERNA do Docker (`http://api:3333`) — sem sair do servidor. É o que mantém
# o cookie de sessão same-site e o segredo interno fora da rede pública.

server {
    listen 80;
    listen [::]:80;
    server_name beesocial.bio www.beesocial.bio;

    # Avatar e capa chegam como data URL em base64 (~1,8 MB por foto de
    # celular) e passam por aqui a caminho da API. O default do nginx é 1 MB —
    # sem esta linha, trocar a foto responderia 413 antes de chegar no Next.
    client_max_body_size 10m;

    # O bundle e as imagens do Next já vêm com hash no nome; comprimir o que
    # sobra (HTML, JSON do RSC) é o que pesa numa conexão de celular, que é como
    # a audiência da criadora chega.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # As três linhas acima são o que alimenta o analytics: o redirecionador
        # `/r/<código>` lê o IP da visitante para decidir robô e montar o
        # prefixo de rede do relatório, e `$remote_addr` aqui é a conexão real.
        # `x-real-ip` é o primeiro cabeçalho que `clientIp()` procura
        # (app/r/[code]/route.ts:56).
        #
        # Upgrade/Connection: o Next em produção não abre websocket, mas deixar
        # o caminho pronto não custa nada e evita um 400 silencioso no dia em
        # que alguma rota precisar.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Estáticos do Next: nome com hash, conteúdo imutável. Cache longo aqui
    # tira do servidor toda revisita — e o perfil de uma criadora é exatamente
    # o tipo de página que a mesma fã abre várias vezes.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
