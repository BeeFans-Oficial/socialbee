# Cache em disco das imagens das criadoras (ver snippets/beesocial-media.conf).
#
# Instalar em: /etc/nginx/conf.d/beesocial-media-cache.conf
# (o nginx.conf padrão do Ubuntu inclui conf.d/*.conf no bloco `http`, que é
# o único lugar onde `proxy_cache_path` pode ficar).
#
#   mkdir -p /var/cache/nginx/beesocial-media && chown www-data: /var/cache/nginx/beesocial-media
#
# 5 GB no disco da VPS, o suficiente para milhares de perfis com as quatro
# imagens cada. Passou disso, o nginx apaga as menos usadas. `inactive=30d`:
# imagem que ninguém pede em 30 dias sai, e volta do R2 na próxima visita.
proxy_cache_path /var/cache/nginx/beesocial-media
    levels=1:2
    keys_zone=beesocial_media:10m
    max_size=5g
    inactive=30d
    use_temp_path=off;
