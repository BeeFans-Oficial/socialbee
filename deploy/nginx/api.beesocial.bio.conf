# BeeSocial — borda da API.
#
# Instalar em:
#   /etc/nginx/sites-available/api.beesocial.bio
#   ln -s ../sites-available/api.beesocial.bio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Este arquivo é a versão SEM TLS, de propósito. O certbot reescreve este bloco
# ao emitir o certificado — ele acrescenta o `listen 443 ssl`, as linhas de
# certificado e o redirecionamento da 80 para a 443:
#
#   certbot --nginx -d api.beesocial.bio
#
# Por isso a porta 80 precisa continuar respondendo ao `/.well-known/`: é por
# ali que a Let's Encrypt valida o domínio, na emissão e em toda renovação.
#
# QUEM CHAMA ESTA API POR AQUI: ninguém do produto. O front roda na MESMA
# máquina e alcança a API pela rede interna do Docker (`http://api:3333`), sem
# encostar nesta borda. O navegador também não: ele chama `/api/v1/*` no domínio
# do front, e o Route Handler do Next repassa. É o que mantém o cookie de sessão
# same-site.
#
# Este bloco existe para o que vem DE FORA — Postman, curl, um app futuro — e
# para o dia em que o front voltar a rodar em outra máquina. Se nada disso for
# necessário agora, não publicá-lo é uma opção legítima (ver a nota no fim).

server {
    listen 80;
    listen [::]:80;
    server_name api.beesocial.bio;

    # Avatares chegam como data URL em base64 (~1,8 MB por foto de celular), e a
    # API aceita corpo de até 10 MB (api/src/main.ts). O default do nginx é 1 MB
    # — sem esta linha, trocar a foto de perfil responderia 413 antes mesmo de a
    # requisição chegar na API.
    client_max_body_size 10m;

    # O container publica só no loopback (127.0.0.1:3333, ver
    # docker-compose.prod.yml). Não existe outro caminho até a API.
    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        # `$host` e não `$proxy_host`: a API não decide nada por Host, mas o log
        # dela fica legível quando mostra o nome real em vez de 127.0.0.1.
        proxy_set_header Host              $host;

        # O IP de quem chamou. `$proxy_add_x_forwarded_for` ANEXA o salto atual
        # à lista que já veio em vez de sobrescrevê-la, e a API lê o PRIMEIRO
        # endereço (`trust proxy` em api/src/main.ts:38).
        #
        # Pelo caminho do produto o IP da visitante NÃO passa por aqui: quem o
        # repassa é o Route Handler do Next (app/api/v1/[...path]/route.ts:64),
        # pela rede interna. O que estas linhas preservam é o endereço de um
        # cliente externo atrás do próprio proxy — e é também o que abre a
        # brecha descrita no fim deste arquivo.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A API responde JSON e imagens pequenas; nada aqui é streaming.
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Sondagem de saúde direta, sem passar pelo log de acesso. Toca o banco de
    # propósito (ver api/src/health/health.controller.ts): processo que responde
    # 200 sem conseguir consultar o Postgres é o pior tipo de "saudável".
    location = /v1/health {
        proxy_pass http://127.0.0.1:3333/v1/health;
        access_log off;
    }
}

# NOTA DE SEGURANÇA — em aberto, não resolvida aqui.
#
# Com a API alcançável pela internet, qualquer um pode chamá-la direto e inventar
# um `x-forwarded-for`. Como o Express confia no primeiro endereço da lista, o
# throttler (240 req/min por IP, api/src/app.module.ts:44) passa a ser
# contornável trocando o cabeçalho a cada requisição.
#
# Não dá para consertar baixando o `trust proxy` para 1 salto: pelo caminho do
# produto quem fala com a API é o container `web`, e o IP da visitante vem no
# cabeçalho que ele monta — a API passaria a ver o endereço interno do Docker e
# todo clique do relatório viraria o mesmo. Os caminhos são `limit_req` aqui no
# nginx (chaveado por $binary_remote_addr, que é a conexão real e não um
# cabeçalho) ou exigir o segredo interno em mais rotas.
#
# E há uma terceira saída, que só passou a existir com o front nesta mesma
# máquina: NÃO publicar este vhost. O produto não depende dele; Postman e curl
# alcançariam a API por um túnel SSH (`ssh -L 3333:127.0.0.1:3333 vps`), e a
# superfície some junto com a brecha. Decisão pendente.
