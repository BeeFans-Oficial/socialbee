# BeeSocial — painel do MinIO (storage de imagens), só para a equipe.
#
# Instalar em:
#   /etc/nginx/sites-available/storage.beesocial.bio
#   ln -s ../sites-available/storage.beesocial.bio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Versão SEM TLS, de propósito: o certbot reescreve este bloco ao emitir o
# certificado, acrescentando o `listen 443 ssl` e o redirecionamento da 80.
#
#   certbot --nginx -d storage.beesocial.bio
#
# ANTES disto, no .env: STORAGE_CONSOLE_URL=https://storage.beesocial.bio e as
# credenciais do usuário de leitura (MINIO_CONSOLE_USER / _PASSWORD). O MinIO
# usa a primeira para montar o redirecionamento do login.
#
# TRÊS DEFESAS, e as três juntas:
#   1. `include snippets/beesocial-admin-ips.conf` — só os IPs listados chegam
#      ao formulário; o resto recebe 403 aqui no nginx.
#   2. Entra-se com o usuário SÓ DE LEITURA (criado por `minio-init`). A
#      credencial raiz não deve ser digitada nesta tela, nunca.
#   3. A imagem do MinIO tem tag fixa no compose; a versão que o painel revela
#      é a que a equipe escolheu atualizar.
#
# Este bloco repassa SÓ para a porta do console (9001). A API S3 (9000) não
# passa por aqui: o único caminho público dela é `/media/` do domínio
# principal, só leitura, só GET.

server {
    listen 80;
    listen [::]:80;
    server_name storage.beesocial.bio;

    include snippets/beesocial-admin-ips.conf;

    # O console é uma SPA que fala com o próprio MinIO por websocket (a lista
    # de objetos atualiza ao vivo). Sem `Upgrade`/`Connection` a tela abre e
    # fica vazia.
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Painel de leitura: ninguém sobe arquivo por aqui. 1 MB (o default)
        # basta para o login e a navegação.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Nada do painel entra em buscador.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
