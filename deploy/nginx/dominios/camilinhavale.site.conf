# camilinhavale.site — domínio próprio de uma criadora (não é do pool).
#
# Instalar em:
#   /etc/nginx/sites-available/camilinhavale.site
#   ln -s ../sites-available/camilinhavale.site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Versão SEM TLS, de propósito: o certbot reescreve este bloco ao emitir o
# certificado, acrescentando o listen 443 e o redirecionamento da 80.
#
#   certbot --nginx -d camilinhavale.site -d www.camilinhavale.site
#
# Um certbot POR DOMÍNIO, nunca um comando cobrindo vários: certificado é
# registro público (crt.sh), e um cobrindo o pool inteiro entrega a lista de
# endereços a bloquear.

server {
    listen 80;
    listen [::]:80;
    server_name camilinhavale.site www.camilinhavale.site;

    include snippets/beesocial-app.conf;
}
