# abreaqui.store — domínio do pool.
#
# Instalar em:
#   /etc/nginx/sites-available/abreaqui.store
#   ln -s ../sites-available/abreaqui.store /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Versão SEM TLS, de propósito: o certbot reescreve este bloco ao emitir o
# certificado, acrescentando o listen 443 e o redirecionamento da 80.
#
#   certbot --nginx -d abreaqui.store -d www.abreaqui.store
#
# Um certbot POR DOMÍNIO, nunca um comando cobrindo vários: certificado é
# registro público (crt.sh), e um cobrindo o pool inteiro entrega a lista de
# endereços a bloquear.

server {
    listen 80;
    listen [::]:80;
    server_name abreaqui.store www.abreaqui.store;

    include snippets/beesocial-app.conf;
}
