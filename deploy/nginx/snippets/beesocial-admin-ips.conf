# IPs autorizados a abrir o painel do MinIO (storage.beesocial.bio).
#
# Instalar em: /etc/nginx/snippets/beesocial-admin-ips.conf
#
# Uma linha `allow` por endereço ou faixa; o `deny all` no fim barra o resto
# com 403 ANTES de o pedido chegar ao formulário de login do MinIO. É a
# primeira das três defesas do painel (as outras: usuário só de leitura e tag
# de versão fixa).
#
# Como descobrir o seu IP: `curl -4 ifconfig.me` na máquina de onde vai
# acessar. IP residencial MUDA (reinício do roteador, troca de operadora) —
# quando o painel responder 403 do nada, é isso: confira o IP e atualize aqui.
# Faixa (`/24`) em vez de IP único cobre a troca dentro da mesma operadora, ao
# custo de abrir para os vizinhos de bloco.
#
# Depois de editar: nginx -t && systemctl reload nginx

allow 179.214.126.160;             # Gabriel — máquina de trabalho, 2026-10-14

deny all;
