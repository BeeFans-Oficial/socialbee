# Corpo compartilhado dos domínios do pool.
#
# Instalar em: /etc/nginx/snippets/beesocial-app.conf
#
# Tudo o que um domínio do pool precisa para servir o app, menos o
# `server_name` — que é a única coisa que muda entre eles. Cada domínio tem um
# arquivo de dez linhas em sites-available que abre o `server` e dá `include`
# neste.
#
# Por que um trecho compartilhado e não seis cópias: o dia em que um limite de
# proxy, um cabeçalho ou uma regra de cache mudar, ela muda em um lugar. Seis
# cópias divergem — e a que fica para trás é sempre a que ninguém está olhando.
#
# `beesocial.bio` NÃO usa este trecho, de propósito: o arquivo dele está no ar,
# já foi reescrito pelo certbot com as linhas de TLS, e reinstalá-lo só para
# uniformizar significaria mexer no domínio principal em produção por motivo
# cosmético. Quando ele precisar de manutenção de verdade, migra junto.

# Avatar e capa chegam como data URL em base64 (~1,8 MB por foto de celular) e
# passam por aqui a caminho da API. O default do nginx é 1 MB — sem esta linha,
# trocar a foto responderia 413 antes de chegar no Next.
client_max_body_size 10m;

# O bundle e as imagens do Next já vêm com hash no nome; comprimir o que sobra
# (HTML, JSON do RSC) é o que pesa numa conexão de celular, que é como a
# audiência da criadora chega.
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # O IP real da visitante. O redirecionador `/r/<código>` o usa para decidir
    # robô e montar o prefixo de rede do relatório, e `$remote_addr` aqui é a
    # conexão de verdade. `x-real-ip` é o primeiro cabeçalho que `clientIp()`
    # procura (app/r/[code]/route.ts:56).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `Host` acima não é detalhe neste arquivo: é por ele que o app sabe em qual
    # domínio do pool a visita entrou — o que alimenta o endereço que o botão de
    # copiar entrega e o registro de qual domínio recebeu o tráfego.

    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

# Estáticos do Next: nome com hash, conteúdo imutável. Cache longo aqui tira do
# servidor toda revisita — e o perfil de uma criadora é exatamente o tipo de
# página que a mesma fã abre várias vezes.
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
