# Imagens das criadoras (avatar, capa, página de chegada, miniatura), servidas
# do bucket no Cloudflare R2 COM CACHE EM DISCO nesta VPS.
#
# Instalar em: /etc/nginx/snippets/beesocial-media.conf
# Exige também: conf.d/beesocial-media-cache.conf (o `proxy_cache_path`) e
# snippets/beesocial-media-origem.conf (o host do bucket; ver abaixo).
#
# Incluído por TODOS os blocos de servidor (o domínio principal e o snippet do
# pool): a página de qualquer domínio carrega imagem por `/media/`.
#
# Por que o nginx está no caminho, e não o navegador falando direto com o R2:
# o bucket está numa conta Cloudflare diferente da que tem a zona
# `beesocial.bio`, e domínio próprio no R2 exige as duas na mesma conta. O
# que sobra é a URL de desenvolvimento do bucket (`pub-xxxx.r2.dev`), que a
# Cloudflare limita em taxa e não cacheia. Este bloco resolve as duas coisas:
# a URL que o HTML carrega é a da empresa, e cada imagem é buscada no R2 UMA
# vez e servida do disco daqui nas próximas (30 dias, ou até ser despejada).
#
# O host do bucket NÃO fica neste arquivo: é dado de ambiente, como o .env. Vai
# em snippets/beesocial-media-origem.conf, uma linha, só na VPS:
#
#     set $media_origem pub-xxxxxxxxxxxxxxxx.r2.dev;
#
# Com o host numa variável o nginx precisa de `resolver` (ele não resolve
# nomes em variável pelo /etc/hosts) e de SNI explícito (`proxy_ssl_name`).

location ~ ^/media/(?<media_chave>.+)$ {
    include snippets/beesocial-media-origem.conf;

    # Só leitura por aqui. Upload é pela API, autenticado.
    limit_except GET HEAD { deny all; }

    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    proxy_pass https://$media_origem/$media_chave;
    proxy_http_version 1.1;
    proxy_set_header Host $media_origem;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name $media_origem;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # --- cache em disco
    proxy_cache beesocial_media;
    proxy_cache_key "$media_origem/$media_chave";
    # A chave da imagem carrega carimbo de tempo e nunca é sobrescrita: um
    # 200 pode ficar o tempo que o disco deixar. 404 fica pouco, porque pode
    # ser a corrida entre o upload e a primeira visita.
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    # Várias visitas à mesma imagem fria: UMA vai ao R2, as outras esperam.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    # R2 fora, lento ou limitando (429): serve o que está no disco.
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    # O que o R2 responder de cabeçalho de cache não manda aqui — nem no
    # nginx (`ignore`) nem no navegador (`hide`; o nosso vai abaixo).
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;
    proxy_hide_header cf-ray;
    proxy_hide_header cf-cache-status;
    proxy_hide_header report-to;
    proxy_hide_header nel;

    # Para o navegador: cache longo e imutável, pelo mesmo motivo acima. Um
    # cabeçalho só (`expires` emitiria um segundo Cache-Control).
    add_header Cache-Control "public, max-age=2592000, immutable";
    # HIT / MISS / STALE — é como se confere, no DevTools, que o cache trabalha.
    add_header X-Cache-Status $upstream_cache_status;
    access_log off;
}
