# Imagens das criadoras (avatar, capa, página de chegada), servidas do MinIO.
#
# Instalar em: /etc/nginx/snippets/beesocial-media.conf
#
# Incluído por TODOS os blocos de servidor (o domínio principal e o snippet do
# pool), porque a página de qualquer domínio carrega imagem por `/media/`.
#
# O navegador pede `https://<domínio>/media/profiles/<id>/avatar-<ts>.webp` e
# o nginx repassa para o bucket `beesocial` do MinIO, que escuta só no loopback
# (docker-compose.prod.yml). A API nunca entra no caminho de uma imagem: ela
# grava no bucket pela rede interna do Docker, e quem serve é este bloco.
#
# A barra no fim do `proxy_pass` importa: é ela que troca o prefixo `/media/`
# pelo `/beesocial/` do bucket. Sem ela, o MinIO receberia `/media/...` e
# responderia 404.

location /media/ {
    proxy_pass http://127.0.0.1:9000/beesocial/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # Só leitura por aqui. Upload é pela API, autenticado; qualquer outro
    # método neste caminho é alguém tentando escrever no bucket pela borda.
    limit_except GET HEAD { deny all; }

    # Cabeçalhos internos do S3 que não dizem nada ao navegador.
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-bucket-region;

    # Cache longo e imutável: a chave da imagem carrega um carimbo de tempo e
    # nunca é sobrescrita — trocar a foto cria OUTRA URL. Então o que o
    # navegador guardou nunca fica velho; no máximo deixa de ser pedido.
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}
