# BeeSocial — produção na VPS: BANCO, API e FRONT.
#
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# O produto inteiro roda nesta máquina, nos três serviços abaixo. Os três
# publicam SÓ no loopback: quem atende a internet e termina o TLS é o **nginx
# nativo do host** (apt + certbot), não um container — por isso não há serviço
# de borda neste arquivo. Os dois blocos de servidor estão em deploy/nginx/.
#
#     navegador ──> nginx (host, :80/:443)
#                     ├─ beesocial.bio         ──> 127.0.0.1:3000   web   (Next)
#                     ├─ beesocial.bio/media/  ──> 127.0.0.1:9000   minio (imagens)
#                     ├─ storage.beesocial.bio ──> 127.0.0.1:9001   minio (painel, só IPs da equipe)
#                     └─ api.beesocial.bio     ──> 127.0.0.1:3333   api   (NestJS)
#
#     web ──(rede interna do Compose)──> api:3333 ──> db:5432
#                                                 └──> minio:9000
#
# Por que o navegador nunca fala direto com a API: ele chama `/api/v1/*` no
# domínio do FRONT e quem repassa é o Route Handler do Next
# (app/api/v1/[...path]/route.ts), lendo API_INTERNAL_URL a cada requisição. É
# o que mantém o cookie de sessão same-site. O domínio público da API existe
# para Postman e clientes externos; o caminho do produto não passa por ele.
#
# ARQUIVO AUTÔNOMO, e não um override de docker-compose.yml: o Compose ANEXA
# listas de `ports`, nunca as substitui. Um override herdaria os `5433:5432` e
# `3333:3333` do arquivo de desenvolvimento e o Postgres continuaria publicado
# na internet — exatamente o que este arquivo existe para impedir.

name: beesocial

# Log com teto. O default do Docker é arquivo que cresce sem limite — é assim
# que um disco enche e o Postgres para de aceitar escrita por falta de espaço.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beesocial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-beesocial}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # SEM `ports`. Nem no loopback: quem fala com o banco é a API, pela rede
    # interna do Compose. Para abrir um psql:
    #   docker compose -f docker-compose.prod.yml exec db psql -U beesocial
    volumes:
      - beesocial-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beesocial} -d ${POSTGRES_DB:-beesocial}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Armazenamento de objetos para as imagens (avatar, capa, página de chegada).
  # Ver o serviço homônimo em docker-compose.yml para o porquê de cada linha.
  #
  # Diferenças de produção: as duas portas publicadas SÓ no loopback (quem
  # serve a imagem ao navegador é o nginx, em `/media/`; quem serve o painel é
  # o nginx, no domínio de STORAGE_CONSOLE_URL, com lista de IPs), credenciais
  # obrigatórias e tag de imagem fixa.
  #
  # O painel (porta 9001) existe para olhar o bucket. Entra-se nele com o
  # usuário SÓ DE LEITURA criado por `minio-init` — nunca com a raiz, que
  # apaga bucket e muda política. Ver deploy/nginx/storage.beesocial.bio.conf.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD (openssl rand -hex 32)}
      # Atrás do nginx o console precisa saber o endereço PÚBLICO dele para
      # montar os redirecionamentos do login. Sem isto, o login manda o
      # navegador para `http://minio:9001`, que não existe fora do Docker.
      MINIO_BROWSER_REDIRECT_URL: ${STORAGE_CONSOLE_URL:?defina STORAGE_CONSOLE_URL - ex. https://storage.beesocial.bio}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      # Entra na rotina de backup JUNTO com beesocial-db: banco sem as imagens
      # é perfil sem foto.
      - beesocial-media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    # Fixo pelo digest (a imagem do mc não publica a release como tag).
    # Corresponde a mc RELEASE.2025-08-13T08-35-41Z.
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    logging: *logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-beesocial}
      MINIO_CONSOLE_USER: ${MINIO_CONSOLE_USER:?defina MINIO_CONSOLE_USER}
      MINIO_CONSOLE_PASSWORD: ${MINIO_CONSOLE_PASSWORD:?defina MINIO_CONSOLE_PASSWORD (openssl rand -hex 32)}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        mc anonymous set download local/$$S3_BUCKET &&
        mc admin policy create local beesocial-leitura /politica-leitura.json &&
        mc admin user add local \"$$MINIO_CONSOLE_USER\" \"$$MINIO_CONSOLE_PASSWORD\" &&
        (mc admin policy attach local beesocial-leitura --user \"$$MINIO_CONSOLE_USER\" 2>&1 | grep -v -i 'already' || true) &&
        mc admin policy entities local --user \"$$MINIO_CONSOLE_USER\"
      "
    volumes:
      # A política do usuário de leitura: listar e abrir objetos do bucket,
      # nada mais. A `readonly` embutida do MinIO NÃO lista (só lê objeto por
      # nome), e o painel ficaria vazio.
      - ./deploy/minio/politica-leitura.json:/politica-leitura.json:ro

  api:
    build:
      context: ./api
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER:-beesocial}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-beesocial}
      DB_SCHEMA: ${DB_SCHEMA:-socialbee}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (openssl rand -hex 32)}
      JWT_TTL: ${JWT_TTL:-7d}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?defina INTERNAL_API_SECRET (openssl rand -hex 32)}
      # A origem pública do FRONT — não o domínio da API.
      #
      # O caminho do navegador é same-origin (passa pelo Route Handler do Next),
      # então o CORS só é exercitado por acesso direto: curl, Postman, um app
      # futuro. Mantê-lo restrito impede que outra origem peça com credenciais.
      CORS_ORIGINS: ${SITE_URL:?defina SITE_URL - origem publica do front}
      PUBLIC_SITE_URL: ${SITE_URL:?defina SITE_URL}
      # O cookie de sessão chega ao navegador pelo nginx, que é quem serve
      # HTTPS (certbot). Sem TLS na borda, `secure` faria o navegador descartar
      # o cookie e ninguém conseguiria entrar.
      COOKIE_SECURE: "true"
      # Conta de demonstração DESLIGADA. `seed.ts` se protege sozinho quando a
      # variável está AUSENTE, mas o compose de dev sempre define um valor — e
      # valor definido vence o guard. Aqui é explícito.
      SEED_DEMO: "false"
      # IP público desta VPS: o valor do registro A que a criadora cria para
      # conectar um domínio próprio, e o que o painel compara ao conferir o
      # DNS. Opcional — sem ele o painel pede para ela falar com a equipe.
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-}
      # Armazenamento de imagens. A API grava pela rede interna (S3_ENDPOINT);
      # o navegador lê pelo nginx, em `/media/` do domínio público — é o
      # `location` de deploy/nginx/snippets/beesocial-media.conf.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-beesocial}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_PUBLIC_URL: ${SITE_URL:?defina SITE_URL}/media
    # Publicada SÓ no loopback do host.
    #
    # O `127.0.0.1:` no começo não é detalhe: sem ele o Docker faz bind em
    # 0.0.0.0 e escreve iptables ANTES do ufw, então a regra de firewall não
    # bloquearia — a API ficaria acessível pela internet sem TLS e aceitando
    # `x-forwarded-for` forjado. Com o prefixo, só processos da própria máquina
    # alcançam, e o único que alcança é o nginx.
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      args:
        # Embutida no bundle no BUILD. O Dockerfile exige esta variável (não tem
        # default lá, de propósito): sem ela o build FALHA, em vez de produzir
        # uma imagem com `localhost` chumbado no botão de copiar.
        #
        # Trocar o domínio depois exige rebuild, não basta reiniciar:
        #   docker compose -f docker-compose.prod.yml up -d --build web
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?defina SITE_URL}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      # A API pela REDE INTERNA do Compose, não pelo domínio público.
      #
      # É a vantagem de ter o front na mesma máquina: a chamada não sai do
      # servidor. Sem salto pela internet, sem custo de TLS a cada requisição, e
      # o INTERNAL_API_SECRET nunca trafega fora daqui. O caminho público
      # (api.beesocial.bio) continua existindo para Postman e clientes externos,
      # mas o produto não depende dele.
      #
      # Lida a CADA requisição pelo Route Handler — é por isso que o repasse não
      # é `rewrites`, que congelaria o destino no build.
      API_INTERNAL_URL: http://api:3333
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?defina INTERNAL_API_SECRET}
      # Repetida aqui por completude — o valor que o navegador enxerga é o que
      # foi embutido no BUILD, acima. Mudar só esta linha não muda nada na tela.
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:?defina SITE_URL}
    # Publicada SÓ no loopback, como a API. Quem atende a internet é o nginx.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  beesocial-db:
  beesocial-media:
