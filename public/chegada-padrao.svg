<?xml version="1.0" encoding="UTF-8"?>
<!--
  Imagem padrão da página de chegada.

  É o que a fã vê ao cair vinda do Instagram — e, pela mesma rota, o que o robô
  da rede social vê. Por isso é abstrata e de marca: nenhuma pele, nenhum rosto,
  nada que dispare revisão automática. A criadora troca pela dela quando quiser,
  e a dela sempre ganha desta.

  Vetor e não foto: pesa 2 KB, serve qualquer densidade de tela, e o primeiro
  documento que a fã recebe chega dentro de um aplicativo, em rede móvel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="brilho" cx="50%" cy="28%" r="62%">
      <stop offset="0%"   stop-color="#FF3C6E" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#FF1F57" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#151515"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <!-- Favo: o mesmo motivo do fundo do produto, para a chegada não parecer
         de outro lugar. -->
    <pattern id="favo" width="120" height="104" patternUnits="userSpaceOnUse">
      <path d="M60 2 L112 28 L112 76 L60 102 L8 76 L8 28 Z"
            fill="none" stroke="#FF3C6E" stroke-opacity="0.13" stroke-width="1.5"/>
    </pattern>

    <!-- O texto é escrito por cima da metade de baixo: escurecer aqui é o que
         mantém o nome legível sem depender do ajuste da criadora. -->
    <linearGradient id="base-escura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%"  stop-color="#0d0d0d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#base)"/>
  <rect width="1200" height="1600" fill="url(#favo)"/>
  <rect width="1200" height="1600" fill="url(#brilho)"/>

  <g opacity="0.5">
    <path d="M600 300 L744 372 L744 516 L600 588 L456 516 L456 372 Z"
          fill="none" stroke="#FF3C6E" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M600 372 L684 414 L684 498 L600 540 L516 498 L516 414 Z"
          fill="none" stroke="#FF3C6E" stroke-opacity="0.28" stroke-width="2"/>
  </g>

  <rect width="1200" height="1600" fill="url(#base-escura)"/>
</svg>
